x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-info}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DATABASE: ${POSTGRES_DATABASE:-nexus}

x-app: &app
  image: nexus-kb:${NEXUS_IMAGE_TAG:-latest}
  build:
    context: .
  environment: *shared_environment
  init: true
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - /opt/nexus/lore:/opt/nexus/lore:ro

services:
  db:
    image: paradedb/paradedb:0.25.9-pg18
    restart: unless-stopped
    mem_limit: 12g
    shm_size: 2gb
    # Docker's default seccomp profile blocks io_uring_setup.
    security_opt:
      - seccomp=unconfined
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=3GB
      - -c
      - effective_cache_size=9GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - autovacuum_work_mem=256MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - checkpoint_timeout=15min
      - -c
      - min_wal_size=1GB
      - -c
      - max_wal_size=8GB
      - -c
      - wal_buffers=-1
      - -c
      - wal_compression=lz4
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=128
      - -c
      - maintenance_io_concurrency=128
      - -c
      - io_method=io_uring
      - -c
      - default_statistics_target=100
      - -c
      - jit=off
      - -c
      - huge_pages=try
      - -c
      - max_parallel_workers=8
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - max_parallel_maintenance_workers=4
      - -c
      - shared_preload_libraries=pg_search,pg_cron,pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DATABASE:-nexus}
    ports:
      - "127.0.0.1:${NEXUS_DATABASE_PORT:-5432}:5432"
    volumes:
      - /opt/nexus/db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  server:
    <<: *app
    expose:
      - "8080"
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v1/mailing-lists"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    image: nexus-kb-web:${NEXUS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: WebUI/Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${NEXUS_BIND_ADDRESS:-0.0.0.0}:${NEXUS_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  worker:
    <<: *app
    command: ["queues", "--env", "production"]

  migrate:
    image: paradedb/paradedb:0.25.9-pg18
    profiles: ["tools"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DATABASE:-nexus}
    entrypoint: ["bash", "/deploy/migrate.sh"]
    volumes:
      - ./deploy:/deploy:ro
      - ./Sources/NexusKb/Migrations:/migrations:ro
