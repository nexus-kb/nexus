x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-info}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DATABASE: ${POSTGRES_DATABASE:-nexus}

x-app: &app
  image: nexus-kb:${NEXUS_IMAGE_TAG:-latest}
  build:
    context: .
  environment: *shared_environment
  init: true
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - /opt/nexus/lore:/opt/nexus/lore:ro

services:
  db:
    image: paradedb/paradedb:0.25.9-pg18
    restart: unless-stopped
    mem_limit: 8g
    shm_size: 2gb
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=16MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DATABASE:-nexus}
    ports:
      - "127.0.0.1:${NEXUS_DATABASE_PORT:-5432}:5432"
    volumes:
      - /opt/nexus/db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  server:
    <<: *app
    expose:
      - "8080"
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v1/mailing-lists"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    image: nexus-kb-web:${NEXUS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: WebUI/Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${NEXUS_BIND_ADDRESS:-0.0.0.0}:${NEXUS_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  worker:
    <<: *app
    command: ["queues", "--env", "production"]

  migrate:
    image: paradedb/paradedb:0.25.9-pg18
    profiles: ["tools"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DATABASE:-nexus}
    entrypoint: ["bash", "/deploy/migrate.sh"]
    volumes:
      - ./deploy:/deploy:ro
      - ./Sources/NexusKb/Migrations:/migrations:ro
