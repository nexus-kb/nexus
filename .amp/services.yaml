services:
  web:
    command: pnpm dev --host 0.0.0.0 --port "$PORT" --experimentalBundle
    cwd: WebUI
    env:
      NEXUS_API_ORIGIN: http://nexus-dev.tail1326.ts.net:8080
    health: /
    portal:
      title: Nexus WebUI
      description: Vite development server backed by the persistent nexus-dev API over Tailscale.
    agent: control
